name: Smoke test ANGi NG

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'ANGi-v2.1.apk', '.github/workflows/angi-ng-smoke.yml' ]

jobs:
  smoke:
    name: Smoke ANGi NG sur Android ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 33]
    steps:
      - uses: actions/checkout@v4
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Émulateur + test complet
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_4
          emulator-options: -no-snapshot -noaudio -no-boot-anim -no-window -gpu swiftshader_indirect
          script: |
            set -e
            adb root || true
            adb wait-for-device
            sleep 3
            adb emu geo fix 2.288156 49.872177 || true
            echo "=== 1. Installation ==="
            adb install -r ANGi-v2.1.apk
            adb shell pm grant com.starfleet.angi android.permission.SEND_SMS || true
            adb shell pm grant com.starfleet.angi android.permission.ACCESS_FINE_LOCATION || true
            adb shell pm grant com.starfleet.angi android.permission.POST_NOTIFICATIONS || true
            echo "=== 2. Lancement ==="
            adb shell am start -n com.starfleet.angi/.MainActivity
            sleep 15
            adb shell pidof com.starfleet.angi && echo "PROCESS ALIVE" || echo "PROCESS MORT"
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || true
            adb pull /sdcard/ui.xml ui.xml >/dev/null 2>&1 || true
            grep -oE 'text="[^"]*"' ui.xml | head -14 || true
            adb exec-out screencap -p > ecran_main.png
            echo "=== 3. Carte + position ==="
            sleep 3
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || true
            adb pull /sdcard/ui.xml ui.xml >/dev/null 2>&1 || true
            grep -oE 'text="Position : [^"]*"' ui.xml || echo "PAS DE POSITION AFFICHEE"
            grep -c 'android.webkit.WebView' ui.xml && echo "WEBVIEW CARTE PRESENT" || echo "PAS DE WEBVIEW"
            adb exec-out screencap -p > ecran_carte.png
            echo "=== 4. Ajout d'un contact ==="
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || true
            adb pull /sdcard/ui.xml ui.xml >/dev/null 2>&1 || true
            XY=$(python3 -c 'import re,sys; s=open("ui.xml",encoding="utf-8",errors="ignore").read(); n=re.escape(sys.argv[1]); m=re.search(r"text=\"[^\"]*"+n+r"[^\"]*\"[^>]*bounds=\"\[(\d+),(\d+)\]\[(\d+),(\d+)\]\"",s) or re.search(r"bounds=\"\[(\d+),(\d+)\]\[(\d+),(\d+)\]\"[^>]*text=\"[^\"]*"+n+r"[^\"]*\"",s); print((int(m.group(1))+int(m.group(3)))//2, (int(m.group(2))+int(m.group(4)))//2) if m else "")' "Contacts d'urgence")
            echo "tap contacts: $XY"
            adb shell input tap $XY || true
            sleep 3
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || true
            adb pull /sdcard/ui.xml ui.xml >/dev/null 2>&1 || true
            adb exec-out screencap -p > ecran_contacts.png
            XY=$(python3 -c 'import re,sys; s=open("ui.xml",encoding="utf-8",errors="ignore").read(); n=re.escape(sys.argv[1]); m=re.search(r"text=\"[^\"]*"+n+r"[^\"]*\"[^>]*bounds=\"\[(\d+),(\d+)\]\[(\d+),(\d+)\]\"",s) or re.search(r"bounds=\"\[(\d+),(\d+)\]\[(\d+),(\d+)\]\"[^>]*text=\"[^\"]*"+n+r"[^\"]*\"",s); print((int(m.group(1))+int(m.group(3)))//2, (int(m.group(2))+int(m.group(4)))//2) if m else "")' "Ajouter un contact")
            echo "tap ajouter: $XY"
            adb shell input tap $XY || true
            sleep 2
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || true
            adb pull /sdcard/ui.xml ui.xml >/dev/null 2>&1 || true
            python3 -c 'import re; s=open("ui.xml",encoding="utf-8",errors="ignore").read(); eds=re.findall(r"class=\"android.widget.EditText\"[^>]*bounds=\"\[(\d+),(\d+)\]\[(\d+),(\d+)\]\"",s); pts=[((int(e[0])+int(e[2]))//2,(int(e[1])+int(e[3]))//2) for e in eds]; pts.sort(key=lambda p:p[1]); [print(p[0],p[1]) for p in pts]' > edpos.txt
            cat edpos.txt
            NOM=$(sed -n '1p' edpos.txt)
            TEL=$(sed -n '2p' edpos.txt)
            echo "champs nom=$NOM tel=$TEL"
            adb shell input tap $NOM || true
            sleep 1
            adb shell input text "Josselin"
            adb shell input tap $TEL || true
            sleep 1
            adb shell input text "0612345678"
            sleep 1
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || true
            adb pull /sdcard/ui.xml ui.xml >/dev/null 2>&1 || true
            adb exec-out screencap -p > ecran_editcontact.png
            grep -oE 'text="[^"]*"' ui.xml | head -12 || true
            XY=$(python3 -c 'import re,sys; s=open("ui.xml",encoding="utf-8",errors="ignore").read(); n=re.escape(sys.argv[1]); m=re.search(r"text=\"[^\"]*"+n+r"[^\"]*\"[^>]*bounds=\"\[(\d+),(\d+)\]\[(\d+),(\d+)\]\"",s) or re.search(r"bounds=\"\[(\d+),(\d+)\]\[(\d+),(\d+)\]\"[^>]*text=\"[^\"]*"+n+r"[^\"]*\"",s); print((int(m.group(1))+int(m.group(3)))//2, (int(m.group(2))+int(m.group(4)))//2) if m else "")' "Enregistrer")
            echo "tap enregistrer: $XY"
            adb shell input tap $XY || true
            sleep 2
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || true
            adb pull /sdcard/ui.xml ui.xml >/dev/null 2>&1 || true
            adb exec-out screencap -p > ecran_apres_save.png
            grep -oE 'text="[^"]*"' ui.xml | head -12 || true
            grep "Josselin" ui.xml && echo "CONTACT ENREGISTRE OK" || echo "CONTACT ABSENT"
            echo "=== 5. Dialogue edit : bouton Annuler (plus de 'Je vais bien') ==="
            XY=$(python3 -c 'import re,sys; s=open("ui.xml",encoding="utf-8",errors="ignore").read(); n=re.escape(sys.argv[1]); m=re.search(r"text=\"[^\"]*"+n+r"[^\"]*\"[^>]*bounds=\"\[(\d+),(\d+)\]\[(\d+),(\d+)\]\"",s) or re.search(r"bounds=\"\[(\d+),(\d+)\]\[(\d+),(\d+)\]\"[^>]*text=\"[^\"]*"+n+r"[^\"]*\"",s); print((int(m.group(1))+int(m.group(3)))//2, (int(m.group(2))+int(m.group(4)))//2) if m else "")' "Josselin")
            echo "tap contact: $XY"
            adb shell input tap $XY || true
            sleep 2
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || true
            adb pull /sdcard/ui.xml ui.xml >/dev/null 2>&1 || true
            adb exec-out screencap -p > ecran_edit_dialog.png
            grep -oE 'text="[^"]*"' ui.xml | head -12 || true
            grep "Annuler" ui.xml && echo "BOUTON ANNULER OK" || echo "PAS D'ANNULER"
            if grep "Je vais bien" ui.xml; then echo "BUG: JE VAIS BIEN ENCORE PRESENT"; else echo "OK: plus de 'Je vais bien' dans contacts"; fi
            XY=$(python3 -c 'import re,sys; s=open("ui.xml",encoding="utf-8",errors="ignore").read(); n=re.escape(sys.argv[1]); m=re.search(r"text=\"[^\"]*"+n+r"[^\"]*\"[^>]*bounds=\"\[(\d+),(\d+)\]\[(\d+),(\d+)\]\"",s) or re.search(r"bounds=\"\[(\d+),(\d+)\]\[(\d+),(\d+)\]\"[^>]*text=\"[^\"]*"+n+r"[^\"]*\"",s); print((int(m.group(1))+int(m.group(3)))//2, (int(m.group(2))+int(m.group(4)))//2) if m else "")' "Annuler")
            adb shell input tap $XY || true
            sleep 1
            echo "=== 6. Réglages + test alarme ==="
            adb shell input keyevent 4 || true
            sleep 1
            adb shell input keyevent 4 || true
            sleep 2
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || true
            adb pull /sdcard/ui.xml ui.xml >/dev/null 2>&1 || true
            XY=$(python3 -c 'import re,sys; s=open("ui.xml",encoding="utf-8",errors="ignore").read(); n=re.escape(sys.argv[1]); m=re.search(r"text=\"[^\"]*"+n+r"[^\"]*\"[^>]*bounds=\"\[(\d+),(\d+)\]\[(\d+),(\d+)\]\"",s) or re.search(r"bounds=\"\[(\d+),(\d+)\]\[(\d+),(\d+)\]\"[^>]*text=\"[^\"]*"+n+r"[^\"]*\"",s); print((int(m.group(1))+int(m.group(3)))//2, (int(m.group(2))+int(m.group(4)))//2) if m else "")' "Réglages")
            echo "tap reglages: $XY"
            adb shell input tap $XY || true
            sleep 3
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || true
            adb pull /sdcard/ui.xml ui.xml >/dev/null 2>&1 || true
            adb exec-out screencap -p > ecran_reglages.png
            grep -oE 'text="[^"]*"' ui.xml | head -12 || true
            grep "Tester l'alarme" ui.xml && echo "BOUTON TEST PRESENT" || echo "PAS DE BOUTON TEST"
            grep "Version 2.1" ui.xml && echo "VERSION 2.1 OK" || echo "VERSION ABSENTE"
            XY=$(python3 -c 'import re,sys; s=open("ui.xml",encoding="utf-8",errors="ignore").read(); n=re.escape(sys.argv[1]); m=re.search(r"text=\"[^\"]*"+n+r"[^\"]*\"[^>]*bounds=\"\[(\d+),(\d+)\]\[(\d+),(\d+)\]\"",s) or re.search(r"bounds=\"\[(\d+),(\d+)\]\[(\d+),(\d+)\]\"[^>]*text=\"[^\"]*"+n+r"[^\"]*\"",s); print((int(m.group(1))+int(m.group(3)))//2, (int(m.group(2))+int(m.group(4)))//2) if m else "")' "Tester l'alarme")
            echo "tap tester alarme: $XY"
            adb shell input tap $XY || true
            sleep 3
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || true
            adb pull /sdcard/ui.xml ui.xml >/dev/null 2>&1 || true
            adb exec-out screencap -p > ecran_alarme.png
            grep -oE 'text="[^"]*"' ui.xml | head -12 || true
            grep "MODE TEST" ui.xml && echo "BANNIERE MODE TEST OK" || echo "PAS DE MODE TEST"
            grep "Tenez, ça va ?" ui.xml && echo "ECRAN ALARME OK" || echo "PAS D'ECRAN ALARME"
            sleep 1
            adb exec-out screencap -p > ecran_alarme_flash1.png
            sleep 2
            adb exec-out screencap -p > ecran_alarme_flash2.png
            echo "--- attente fin du compte a rebours (15s) ---"
            sleep 11
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || true
            adb pull /sdcard/ui.xml ui.xml >/dev/null 2>&1 || true
            grep "Terminé" ui.xml && echo "FIN DE TEST AFFICHEE" || echo "PAS DE FIN AFFICHEE"
            adb exec-out screencap -p > ecran_alarme_fin.png
            XY=$(python3 -c 'import re,sys; s=open("ui.xml",encoding="utf-8",errors="ignore").read(); n=re.escape(sys.argv[1]); m=re.search(r"text=\"[^\"]*"+n+r"[^\"]*\"[^>]*bounds=\"\[(\d+),(\d+)\]\[(\d+),(\d+)\]\"",s) or re.search(r"bounds=\"\[(\d+),(\d+)\]\[(\d+),(\d+)\]\"[^>]*text=\"[^\"]*"+n+r"[^\"]*\"",s); print((int(m.group(1))+int(m.group(3)))//2, (int(m.group(2))+int(m.group(4)))//2) if m else "")' "Je vais bien")
            adb shell input tap $XY || true
            sleep 2
            adb shell input keyevent 4 || true
            sleep 1
            echo "=== 7. Envoyer ma position (confirmation) ==="
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || true
            adb pull /sdcard/ui.xml ui.xml >/dev/null 2>&1 || true
            XY=$(python3 -c 'import re,sys; s=open("ui.xml",encoding="utf-8",errors="ignore").read(); n=re.escape(sys.argv[1]); m=re.search(r"text=\"[^\"]*"+n+r"[^\"]*\"[^>]*bounds=\"\[(\d+),(\d+)\]\[(\d+),(\d+)\]\"",s) or re.search(r"bounds=\"\[(\d+),(\d+)\]\[(\d+),(\d+)\]\"[^>]*text=\"[^\"]*"+n+r"[^\"]*\"",s); print((int(m.group(1))+int(m.group(3)))//2, (int(m.group(2))+int(m.group(4)))//2) if m else "")' "Envoyer ma position")
            echo "tap envoyer position: $XY"
            adb shell input tap $XY || true
            sleep 7
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || true
            adb pull /sdcard/ui.xml ui.xml >/dev/null 2>&1 || true
            adb exec-out screencap -p > ecran_envoi_position.png
            grep -oE 'text="[^"]*"' ui.xml | head -16 || true
            grep "Position envoyée" ui.xml && echo "DIALOGUE CONFIRMATION OK" || echo "PAS DE CONFIRMATION"
            grep "Destinataires" ui.xml && echo "DESTINATAIRES OK" || echo "PAS DE DESTINATAIRES"
            grep "Résultat" ui.xml && echo "BILAN OK" || echo "PAS DE BILAN"
            XY=$(python3 -c 'import re,sys; s=open("ui.xml",encoding="utf-8",errors="ignore").read(); n=re.escape(sys.argv[1]); m=re.search(r"text=\"[^\"]*"+n+r"[^\"]*\"[^>]*bounds=\"\[(\d+),(\d+)\]\[(\d+),(\d+)\]\"",s) or re.search(r"bounds=\"\[(\d+),(\d+)\]\[(\d+),(\d+)\]\"[^>]*text=\"[^\"]*"+n+r"[^\"]*\"",s); print((int(m.group(1))+int(m.group(3)))//2, (int(m.group(2))+int(m.group(4)))//2) if m else "")' "OK")
            adb shell input tap $XY || true
            sleep 1
            echo "=== 8. Logcat ==="
            adb logcat -d > logcat.txt || true
            grep -E "FATAL EXCEPTION|ANR in com.starfleet" logcat.txt | tail -10 || echo "AUCUN CRASH"
            echo "=== 9. Journal app ==="
            adb shell "cat /sdcard/Download/ANGi_debug.log.txt 2>/dev/null" > angi_debug.txt || true
            cat angi_debug.txt || true
      - name: Artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-api${{ matrix.api-level }}
          path: |
            *.png
            *.txt
            *.xml
          if-no-files-found: warn
