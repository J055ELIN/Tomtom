name: Smoke test ANGi NG

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'ANGi/releases/ANGi-v2.36.apk', 'latest.json', 'scripts/**', '.github/workflows/angi-ng-smoke.yml' ]

jobs:
  smoke:
    name: Smoke ANGi NG sur Android ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 33]
    steps:
      - uses: actions/checkout@v4
      - name: Pillow pour analyse d'image
        run: pip install pillow -q || true
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Émulateur + test complet
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_4
          emulator-options: -no-snapshot -noaudio -no-boot-anim -no-window -gpu swiftshader_indirect
          script: |
            bash scripts/angi-smoke.sh
      - name: Artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-api${{ matrix.api-level }}
          path: |
            *.png
            *.txt
            *.xml
          if-no-files-found: warn
