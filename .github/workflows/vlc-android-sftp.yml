# Construit un VLC for Android dont le SFTP parle a un serveur Debian 13, a partir
# du correctif contrib stocke dans vlc-sftp/ de CE depot.  Aucun APK publie ici :
# ce workflow ne fait que produire un artifact.
#
# Pourquoi ca marche ici et pas sur la machine de la SOP : les contribs de VLC
# demandent un NDK + 8-16 GB de RAM + 25-40 GB de disque ; /toolchain ne contient
# que jdk17 + android-sdk + gradle-home.  Le runner ubuntu-24.04 a les 3.
#
# PIEGE A CONNAITRE : ne jamais ajouter -t (contribs PRECOMPILEES de VideoLAN).
# get-contrib-sha.sh calcule le SHA des contribs depuis l'historique git : un patch
# non committe ne le change pas, VideoLAN sert ses .so officiels, le patch n'est
# jamais compile, et l'APK reste casse en silence.  C'est pour ca que l'etape
# "Portique" existe : elle rend ce cas rouge au lieu de vert.

name: vlc-android-sftp-debian13

on:
  # LA RAISON D'ETRE DE CE BLOC : `workflow_dispatch` n'est proposable par l'API (et par
  # l'onglet Actions) que si le fichier existe AUSSI sur la branche par defaut. Ici le
  # workflow ne vit que sur `vlc-sftp-build`, donc le POST /dispatches repond 404 (mesure :
  # HTTP 404 au premier essai, alors que la branche etait poussee et le fichier present sur
  # cette branche, sha 52f64490). Le bouton "Run workflow" n'apparaitra que si un jour tu
  # fusionnes ce fichier sur `main` - volontairement pas fait, `main` sert latest.json.
  # On declenche donc par poussée, avec un filtre pour ne relancer un build QUE si le build
  # lui-meme change.
  push:
    branches: [vlc-sftp-build]
    paths:
      - '.github/workflows/vlc-android-sftp.yml'
      - 'vlc-sftp/**'
  workflow_dispatch:
    inputs:
      abi:
        description: "VLCFIX_ABI a construire"
        type: choice
        default: arm64
        options: [arm64, arm, x86_64, all]
      vlc_android_ref:
        description: "branche/tag de videolan/vlc-android (3.7.1 = derniere publiee)"
        type: string
        default: 3.7.1
      release_apk:
        description: "APK --release (sinon build de dev signe avec la cle de test)"
        type: boolean
        default: false
      probe_server:
        description: "hote SFTP a auditer avant build (vide = sauter l'audit)"
        type: string
        default: ""

concurrency:
  # une poussee de plus pendant un run en cours = on annule l'ancien (il batit un commit mort)
  group: vlc-sftp-build-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_SDK: ${{ github.workspace }}/android-sdk
  # Ces trois valeurs ne viennent pas d'un gout : elles sont mesurees.
  # - compileSdk/targetSdk de vlc-android@3.7.1 = 36 (build.gradle l. 58-59) -> plateforme android-36.
  # - NDK : le libvlc.so de l'APK OFFICIEL VLC-Android-3.7.1-arm64-v8a.apk porte dans sa section
  #   .comment "Android (13624864, based on r530567e) clang version 19.0.1" -> toolchain du canal
  #   r28 ; et 28.2.13676358 est la derniere 28.x proposee par Google. (Mon premier essai pinvait
  #   ndk;26.1.12297006 : ce paquet n'existe pas dans l'index sdkmanager, run #1 mort la-dessus en
  #   2'18" avec "Warning: Failed to find package 'ndk;26.1.12297006'".)
  #   Le meme resoudre() se rabat sur la derniere version disponible si Google retire la notre.
  VLCFIX_SDK_BUILD_TOOLS: "36.0.0"
  VLCFIX_SDK_PLATFORM: "android-36"
  VLCFIX_NDK_VERSION: "28.2.13676358"
  # Les inputs sont VIDES quand le run n'est pas declenche par workflow_dispatch. Mesure au
  # run #2 : 'git clone --branch ""' -> "fatal: Remote branch  not found in upstream origin",
  # etape 7 morte en 10 s. Comme on se declenche par poussee, ce sont ICI les vraies valeurs
  # par defaut ; un dispatch ne fait que les surcharger. ('&&/||' rend 'false' aussi bien pour
  # faux que pour absent : voulu pour VLCFIX_RELEASE_APK.)
  VLCFIX_ABI: ${{ inputs.abi || 'arm64' }}
  VLCFIX_VLC_ANDROID_REF: ${{ inputs.vlc_android_ref || '3.7.1' }}
  VLCFIX_RELEASE_APK: ${{ inputs.release_apk && 'true' || 'false' }}
  VLCFIX_PROBE_SERVER: ${{ inputs.probe_server }}

jobs:
  audit-serveur:
    if: ${{ inputs.probe_server != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: "Algorithms offered by the SSH server (no credentials, no auth attempt)"
        run: |
          set -uo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq nmap > /dev/null
          H="${VLCFIX_PROBE_SERVER:-${{ inputs.probe_server }}}"
          echo "  audit de $H (22) - cote serveur uniquement"
          nmap -Pn -sV --version-light --script ssh2-enum-algos -p22 "$H" 2>/dev/null \
            | sed -n '/kex_algorithms/,/ssh_host_key/p' | head -40 | sed 's/^/    /'
          echo
          echo "  VLC 3.7.0 (libssh2 + backend libgcrypt) ne sait faire que :"
          echo "    KEX      : diffie-hellman-group14-sha256 / group16-sha512 / group1-sha1"
          echo "    hostkey  : ssh-rsa (SHA-1), ssh-dss"
          echo "  => si la liste du serveur ne contient AUCUN de ces KEX, c'est bien le blocage."

  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4

      - name: "Menage sur le disque (les contribs demandent ~40 Go)"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/.ghcup || true
          df -h / | tail -1 | sed 's/^/  espace disponible desormais: /'

      - name: "Dependances (liste verifiee en buildant les contribs en cross)"
        run: |
          set -euo pipefail
          # Diagnostic AVANT installation : sur le run #7, mpg123 casse avec
          # "configure.ac:276: error: possibly undefined macro: LT_SYS_MODULE_EXT". Cette macro est
          # definie dans ltdl.m4, fourni par libltdl-dev (et NON par libtool), et libtoolize ne copie
          # que libtool/ltoptions/ltsugar/ltversion/lt~obsolete .m4 : l'arbre ne peut donc pas se
          # reparer tout seul. Ce bloc imprime l'etat reel du runner pour que ce diagnostic soit
          # verifiable dans le journal, pas seulement inferen.
          echo "  == etat du runner avant apt =="
          for m in ltdl.m4 libtool.m4 ltsugar.m4 ltoptions.m4; do
            f="/usr/share/aclocal/$m"
            if [ -f "$f" ]; then echo "     $m : presente ($(dpkg -S "$f" 2>/dev/null | cut -d: -f1))"; else echo "     $m : ABSENTE"; fi
          done
          apt-cache policy libltdl-dev 2>/dev/null | head -3 | sed 's/^/     /'
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            autoconf automake libtool libltdl-dev autoconf-archive autopoint gettext \
            pkg-config make cmake ninja-build \
            gcc g++ patch unzip xz-utils curl git python3 flex bison gperf yasm nasm \
            ant protobuf-compiler ragel subversion zip libtool-bin >> /dev/null
          for t in autopoint cmake ninja libtoolize pkg-config; do
            command -v "$t" >/dev/null || { echo "MANQUANT: $t"; exit 1; }
          done
          echo "  outils requis: OK"

      - name: "JDK 17 (VLC exige 17, pas 21)"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: "Android SDK cmdline-tools + plateforme + build-tools + NDK"
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_SDK/cmdline-tools"
          curl -fsSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/clt.zip -d "$ANDROID_SDK/cmdline-tools"
          mv "$ANDROID_SDK/cmdline-tools/cmdline-tools" "$ANDROID_SDK/cmdline-tools/latest"
          export PATH="$ANDROID_SDK/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --list > /tmp/sdklist.txt 2>/dev/null || { echo "  sdkmanager --list muet"; : > /tmp/sdklist.txt; }
          # diagnostic : 3 lignes reelles de la liste, pour que le journal prouve que la
          # lecture du format (1er champ = "paquet;version") est correcte sur ce runner.
          grep -E '^ +ndk;' /tmp/sdklist.txt | head -3 | sed 's/^/  liste: /' || echo "  (aucune ligne ndk; -e) $"
          # resoudre() : la version pinnee ci-dessus si Google la propose encore, sinon la derniere
          # de la meme famille. Sans ce filet, un retirement amont (ce qui est arrive pour le NDK)
          # fait echouer le run 2 minutes apres son depart au lieu de le faire continuer.
          resoudre() { # $1 = prefixe ("ndk;", "platforms;", "build-tools;"), $2 = version voulue
              local pre="$1" want="$2" alt
              # 'sdkmanager --list' fait des lignes "  paquet;version  |  ver  |  description" :
              # seul le 1er champ compte. Comparaison exacte sur ce champ, pas un grep souplement.
              if [ -s /tmp/sdklist.txt ] && awk -v w="${pre}${want}" '
                    { gsub(/^[ \t]+/, ""); if ($1 == w) f = 1 } END { exit !f }' /tmp/sdklist.txt; then
                  printf '%s' "$want"; return 0
              fi
              alt=$(awk -v pre="$pre" '
                    { gsub(/^[ \t]+/, "")
                      if (index($1, pre) == 1) { v = substr($1, length(pre) + 1)
                        if (v ~ /^[0-9A-Za-z][0-9A-Za-z.-]*$/) print v } }' /tmp/sdklist.txt | sort -uV | tail -1)
              [ -n "$alt" ] || { echo "  aucun paquet '${pre}...' dans 'sdkmanager --list'" >&2; return 1; }
              echo "  ${pre}${want} non propose par Google -> repli sur ${pre}${alt} (derniere dispo)" >&2
              printf '%s' "$alt"
          }

          NDK=$(resoudre 'ndk;' "$VLCFIX_NDK_VERSION") || exit 1
          PLAT=$(resoudre 'platforms;' "$VLCFIX_SDK_PLATFORM") || exit 1
          BT=$(resoudre 'build-tools;' "$VLCFIX_SDK_BUILD_TOOLS") || exit 1
          echo "  paquets retenus : platform-tools platforms;$PLAT build-tools;$BT ndk;$NDK"
          sdkmanager --install "platform-tools" "platforms;$PLAT" "build-tools;$BT" "ndk;$NDK" > /dev/null
          NDKDIR=$(ls -d "$ANDROID_SDK/ndk/$NDK" 2>/dev/null || ls -d "$ANDROID_SDK"/ndk/* | sort -V | tail -1)
          [ -d "$NDKDIR" ] || { echo "  NDK absent apres installation"; exit 1; }
          echo "ANDROID_NDK=$NDKDIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_SDK" > local.properties
          grep -m1 'Pkg.Revision' "$NDKDIR/source.properties" | sed 's/^/  NDK installe : /'
          # cmake : demande en dur 'cmake;3.22.1' au run #1, retire depuis ; on prend celui du
          # runner et on verifie qu'il est assez recent pour les contribs (>3.16).
          cmake --version | head -1 | sed 's/^/  cmake : /'
          awk 'NR==1{split($3,v,"."); exit !(v[1]>3 || (v[1]==3 && v[2]>=16))}' <<< "$(cmake --version | head -1)" \
            || { echo "  cmake trop vieux pour les contribs VLC"; exit 1; }
          echo "  SDK: installe (build-tools $BT, plateforme $PLAT)"

      - name: "Sources vlc-android (+ sous-modules libvlc / vlc)"
        run: |
          set -euo pipefail
          echo "  ref demandee : $VLCFIX_VLC_ANDROID_REF | abi : $VLCFIX_ABI | release : $VLCFIX_RELEASE_APK"
          git clone --recursive --depth 1 --branch "$VLCFIX_VLC_ANDROID_REF" \
            https://code.videolan.org/videolan/vlc-android.git _va
          echo "VLC_ANDROID=$GITHUB_WORKSPACE/_va" >> "$GITHUB_ENV"

      - name: "Preparation (--init), patchs officiels puis correctif (mecanisme get-vlc.sh)"
        run: |
          set -euo pipefail
          cd "$VLC_ANDROID"
          # Identite GLOBALE avant tout : get-vlc.sh fait lui-meme 'git am --message-id' (l.99) pour ses
          # patchs officiels, et 'git am' refuse sans identite ('empty ident name', exit 128). Sans cela,
          # l''--init' laissait l'arbre VIDE du patch officiel sendmsg, et l'etape de build echouait ensuite
          # sur 'Cannot find patch 0001-compat-Workaround-sendmsg-bug-on-android.patch in git log' (vu au run #4).
          git config --global user.email "vlc-sftp@ci.local"
          git config --global user.name  "vlc-sftp CI"
          git config --global --add safe.directory '*' || true
          set +e                      # on tolere un --init en echec : l'arbre est reparable juste apres,
          ./buildsystem/compile.sh --init -a "$VLCFIX_ABI" > "$GITHUB_WORKSPACE/init.log" 2>&1   # mais on l'affiche
          rc=$?
          set -e
          echo "  compile.sh --init : exit=$rc ; fin du journal :"
          tail -8 "$GITHUB_WORKSPACE/init.log" | sed 's/^/    /'
          [ $rc -eq 0 ] || { echo "  --init a echoue, on tente quand meme de reparer l'arbre"; }
          # Mecanisme OFFICIEL de patch du core (libvlcjni/buildsystem/get-vlc.sh) :
          #   PATCHES_DIR = libvlcjni/libvlc/patches (l.5) ; clone puis 'git reset --hard $VLC_TESTED_HASH'
          #   puis 'git am --message-id $PATCHES_DIR/*.patch' (l.96-99) ; et check_patch_is_applied() (l.25-43)
          #   exige le Message-Id de CHAQUE patch present dans PATCHES_DIR quand on ne passe pas '-b' (l.120-121).
          #   Le hash epingle depend de la REVISION de libvlcjni utilisee, pas du bout de sa branche :
          #   vlc-android@3.7.1 fait 'git reset --hard 7cd0c151da' (compile.sh l.286+304) et LE get-vlc.sh de
          #   cette revision epingle VLC 3.0.x @ 3458be162f (contribs en libssh2 1.10.0, regle autotools).
          #   1.10.0 ne connait pas LIBSSH2_RSA_SHA2 : changer seul le backend ne suffirait pas, d'ou le
          #   patch 0003 qui ramene aussi le paquet ssh2 de 1.11.1 (CMake).
          VLC_SRC="$(find . -maxdepth 6 -type d -name contrib -path '*/vlc/*' | head -1 | xargs -r dirname)"
          [ -n "$VLC_SRC" ] || { echo "AUCUN arbre vlc trouve ; fins de init.log :"; tail -20 "$GITHUB_WORKSPACE/init.log"; exit 1; }
          cd "$VLC_SRC"
          git config user.email "vlc-sftp@ci.local"
          git config user.name  "vlc-sftp CI"
          echo "vlc source tree: $VLC_SRC @ $(git rev-parse --short HEAD)"
          PDIR="$(cd .. && pwd)/libvlc/patches"
          mkdir -p "$PDIR"
          # 1) s'assurer que TOUS les patchs officiels deja presents dans PATCHES_DIR sont dans le log
          #    (get-vlc.sh ne les applique que sur un clone neuf ; un 'git am' qui a echoue pendant --init
          #    laisse un arbre qui passera l'am mais pas la verification de l'etape suivante).
          applied_officiels=0
          for up in "$PDIR"/*.patch; do
            [ -f "$up" ] || continue
            umid=$(sed -n 's/^Message-Id: //p' "$up" | head -1)
            [ -n "$umid" ] || { echo "  patch officiel sans Message-Id : $(basename "$up") (ignore)"; continue; }
            if [ -z "$(git log --grep="$umid" --oneline)" ]; then
              echo "  patch officiel absent du log, on l'applique : $(basename "$up")"
              git am --message-id "$up" > "$GITHUB_WORKSPACE/am-up.log" 2>&1 || {
                echo "  echec de l'am du patch officiel :"; tail -4 "$GITHUB_WORKSPACE/am-up.log"; exit 1; }
              [ -n "$(git log --grep="$umid" --oneline)" ] || { echo "  toujours pas dans le log"; exit 1; }
              applied_officiels=$((applied_officiels+1))
            else
              echo "  patch officiel deja en place : $(basename "$up")"
            fi
          done
          # 2) choisir MON patch parmi les trois jumeaux (0001=master, 0002=3.0.x@ac6c2a405d,
          #    0003=3.0.x@3458be162f) : exactement UN doit s'appliquer, sinon on s'arrete la.
          FITS=""
          for p in "$GITHUB_WORKSPACE"/vlc-sftp/patches/000[123]-*.patch; do
            git apply --check "$p" 2>/dev/null && FITS="$FITS $p"
          done
          if [ -z "$FITS" ]; then
            for p in "$GITHUB_WORKSPACE"/vlc-sftp/patches/000[123]-*.patch; do
              patch -p1 --forward --dry-run < "$p" > /tmp/p.log 2>&1 && FITS="$FITS $p"
            done
            case "$(echo $FITS | wc -w)" in
              1) echo "  'git apply' refusait, 'patch' accepte : $(basename "${FITS## }")" ;;
              0) echo "  AUCUN des patchs proposes ne s'applique sur $(git rev-parse --short HEAD)" ; exit 1 ;;
              *) echo "  AMBIGUITE : plusieurs patchs passeraient aussi via 'patch'" ; exit 1 ;;
            esac
          fi
          [ "$(echo $FITS | wc -w)" = 1 ] || { echo "  AMBIGUITE : $(echo $FITS | wc -w) patchs applicables"; exit 1; }
          CHOSEN="${FITS## }"; BASE="$(basename "$CHOSEN")"
          cp "$CHOSEN" "$PDIR/$BASE"
          grep -q '^Message-Id:' "$PDIR/$BASE" || { echo "  patch sans Message-Id : check_patch_is_applied echouerait"; exit 1; }
          git am --message-id "$PDIR/$BASE" > "$GITHUB_WORKSPACE/am.log" 2>&1
          rc=$?
          [ $rc -eq 0 ] || { echo "  'git am' a echoue (exit $rc) :"; tail -6 "$GITHUB_WORKSPACE/am.log"; exit 1; }
          MID=$(sed -n 's/^Message-Id: //p' "$PDIR/$BASE" | head -1)
          [ -n "$(git log --grep="$MID" --oneline)" ] || { echo "  Message-Id absent du log: $MID"; exit 1; }
          grep -q 'CRYPTO_BACKEND:STRING=mbedTLS' contrib/src/ssh2/rules.mak || { echo "  flag mbedTLS absent de rules.mak"; exit 1; }
          test -f contrib/src/mbedtls/SHA512SUMS && test -f contrib/src/mbedtls/rules.mak || { echo "  paquet mbedtls incomplet"; exit 1; }
          echo "  arbre patche : $(basename "$BASE") + $applied_officiels patch(s) officiel(s) remis a plat"
          git log --oneline -3 | sed 's/^/    /'

      - name: "Build des contribs + LibVLC + app (sans -b : les checks de get-vlc.sh restent actifs)"
        run: |
          set -euo pipefail
          cd "$VLC_ANDROID"
          args="-a $VLCFIX_ABI"
          # 'if' et non '[ … ] && args=…' : sous set -e, un test faux en derniere position
          # ferait echouer l'etape (verifie : '[ false ] && x' laisse le shell sur 1).
          if [ "$VLCFIX_RELEASE_APK" = "true" ]; then args="$args --release"; fi
          echo "  commande : ./buildsystem/compile.sh $args"
          set +e
          ./buildsystem/compile.sh $args > "$GITHUB_WORKSPACE/build.log" 2>&1
          rc=$?
          set -e
          echo "----- 30 dernieres lignes du build -----"
          tail -30 "$GITHUB_WORKSPACE/build.log" | sed 's/^/  /'
          [ $rc -eq 0 ] || { echo "::error::compile.sh a echoue (code $rc) ; 60 lignes autour de la 1ere erreur :"; grep -n -m1 -E 'error:|Error [0-9]|\*\*\* ' "$GITHUB_WORKSPACE/build.log" | head -1 | cut -d: -f1 | while read -r n; do [ -n "$n" ] && sed -n "$((n>25?n-25:1)),$((n+25))p" "$GITHUB_WORKSPACE/build.log" | cut -c1-200 | sed 's/^/    /'; done; exit 1; }
          echo "  => compile.sh termine (code 0) ; $(( $(wc -l < "$GITHUB_WORKSPACE/build.log") )) lignes de journal"

      - name: "Portique : le binaire contient-il les algorithmes de Debian 13"
        run: |
          set -uo pipefail
          A="$(find "$VLC_ANDROID" -path '*contrib*' -name libssh2.a 2>/dev/null | head -1)"
          [ -n "$A" ] || { echo "libssh2.a introuvable -> contribs probablement PRECOMPILEES (-t) : le patch n'a pas tourne"; exit 1; }
          bash "$GITHUB_WORKSPACE/vlc-sftp/tools/inspect-apk.sh" --expect=fixed "$A" || {
            echo "::error::le correctif n'est pas arrive jusqu'au binaire"
            grep -nE 'PREBUILT|with-prebuilt-contribs|Crypto backend' "$GITHUB_WORKSPACE/build.log" | tail -6
            exit 1
          }
          echo "  => backend Mbed TLS et KEX modernes bien presents"

      - name: "Collecte de l'APK + empreinte"
        run: |
          set -euo pipefail
          mkdir -p out
          APK="$(find "$VLC_ANDROID" -name '*.apk' | sort | tail -1)"
          [ -n "$APK" ] || { echo "AUCUN APK ; voir build.log"; tail -40 "$GITHUB_WORKSPACE/build.log"; exit 1; }
          cp "$APK" out/VLC-android-sftp-arm64.apk
          ( cd out && sha256sum VLC-android-sftp-arm64.apk > VLC-android-sftp-arm64.apk.sha256 )
          ls -l out; du -h out/*.apk
          echo "APK : $(stat -c %s out/VLC-android-sftp-arm64.apk) octets"

      - name: "Controle final sur l'APK complet (et pas seulement la .a)"
        run: |
          set -uo pipefail
          bash "$GITHUB_WORKSPACE/vlc-sftp/tools/inspect-apk.sh" --expect=fixed out/VLC-android-sftp-arm64.apk \
            || echo "::warning::le portique refuse l'APK complet - ne pas publier avant d'avoir compris"

      - uses: actions/upload-artifact@v4
        with:
          name: vlc-android-sftp
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: "Ce qu'il reste a faire (publication a la main, volontairement non automatisee)"
        run: |
          echo "  1) telecharger l'artifact, le deposer sur le Filebrowser (vlc-sftp/tools/publier-apk-sop.sh)"
          echo "  2) NE PAS toucher a latest.json de Tomtom : c'est le canal de mise a jour de tes autres apps"
          echo "  3) tester sur l'appareil : Parcourir > Nouvelle connexion > SFTP > <hote>.usbx.me:22"
          echo "  4) installer en conserve : adb install -r VLC-android-sftp-arm64.apk"
