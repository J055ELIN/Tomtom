# ============================================================================
# Workflow de test ANGi sur émulateur Android (GitHub Actions)
# Utilise ReactiveCircus/android-emulator-runner (KVM activé sur les runners)
#
# Test complet :
#   - installation + lancement sans crash
#   - écran d'accueil ANGi (START RIDE)
#   - Réglages → scroll → Emergency Contacts → ajout d'un contact
#   - vérification du contact dans la liste
#   - « Envoyer ma position » (chemin SMS, journal attendu)
#   - récupération du journal ANGi (Téléchargements) + logcat + captures
#
# Testé en parallèle sur Android 11 (API 30 — Cubot) et Android 13 (API 33 — Pixel).
# ============================================================================
name: Test ANGi sur émulateur

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  test-angi:
    name: ANGi sur Android ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 33]

    steps:
      - name: Récupérer le code (contient l'APK)
        uses: actions/checkout@v4

      - name: Activer KVM (accélération matérielle)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Lancer l'émulateur et tester l'app
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_4
          emulator-options: -no-snapshot -noaudio -no-boot-anim -no-window -gpu swiftshader_indirect
          script: |
            set -e
            adb root || true
            adb wait-for-device
            sleep 3

            echo "===== 1. Installation de l'APK ====="
            adb install -r ANGi/releases/ANGi-v1.1.apk
            adb shell pm grant com.starfleet.angi android.permission.SEND_SMS || echo "grant SMS ignoré"
            adb shell pm grant com.starfleet.angi android.permission.ACCESS_FINE_LOCATION || echo "grant loc ignoré"
            adb shell pm grant com.starfleet.angi android.permission.POST_NOTIFICATIONS || echo "grant notif ignoré (API<33)"

            echo "===== 1b. Fermer les dialogs ANR du launcher ====="
            python3 .github/scripts/ui_tap.py "Wait" 0 2>/dev/null || true
            adb shell input keyevent 4 || true
            sleep 2
            python3 .github/scripts/ui_tap.py "Close app" 0 2>/dev/null || true
            adb shell input keyevent 4 || true
            sleep 2

            echo "===== 2. L'app tourne-t-elle ? ====="
            adb shell am start -n com.starfleet.angi/com.specialized.ride.android.MainActivity
            sleep 25
            adb shell pidof com.starfleet.angi && echo "PROCESS ALIVE" || echo "PROCESS MORT !"

            echo "===== 3. Test UI complet (script ui_test.py) ====="
            python3 .github/scripts/ui_test.py > ui_test_out.txt 2>&1 || echo "(script ui_test terminé avec code $?)"
            cat ui_test_out.txt

            echo "===== 4. Logcat + journal ====="
            adb logcat -d > logcat.txt || true
            adb shell "ls -la /sdcard/Download/ 2>/dev/null; echo '--- CONTENU ---'; cat /sdcard/Download/ANGi_debug.log.txt 2>/dev/null; cat /sdcard/Download/ANGi_debug.log 2>/dev/null" > angi_debug.txt || true
            cat angi_debug.txt || true

            echo "===== 5. Bilan crash ====="
            grep -E "FATAL EXCEPTION|Process: com.starfleet.angi.*FATAL|ANR in com.starfleet" logcat.txt | tail -20 || echo "AUCUN CRASH DETECTE"

      - name: Publier les artefacts (captures, logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-api${{ matrix.api-level }}
          path: |
            *.png
            *.txt
            *.xml
          if-no-files-found: warn
