# ============================================================================
# QRing → Strava HR Bridge : compilation + publication automatique de l'APK
#
# À COPIER DANS .github/workflows/ (l'outil de cette session n'a pas la
# permission « Workflows » pour l'y déposer lui-même).
#
# Après dépôt : chaque modification du pont recompile et republie l'APK.
# Lien de téléchargement permanent (toujours la dernière version) :
#   https://github.com/J055ELIN/Tomtom/releases/download/bridge-latest/QRingStravaBridge.apk
# ============================================================================
name: QRing Strava Bridge — APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'qring-strava-bridge/**'
      - '.github/workflows/qring-strava-bridge-build.yml'

permissions:
  contents: write

jobs:
  build:
    name: Compiler et signer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.meta.outputs.version }}
      code: ${{ steps.meta.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lire la version
        id: meta
        working-directory: qring-strava-bridge
        run: |
          CODE=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle | head -1)
          NAME=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1)
          echo "version=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version $NAME ($CODE)"

      - name: Compilation (assembleRelease)
        working-directory: qring-strava-bridge
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Vérifier et nommer l'APK
        working-directory: qring-strava-bridge
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK" || { echo "Aucune APK produite"; exit 1; }
          cp "$APK" /tmp/QRingStravaBridge.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          echo "build-tools : $BT"
          "$BT/aapt" dump badging /tmp/QRingStravaBridge.apk | grep -E '^package' || true
          "$BT/apksigner" verify --print-certs /tmp/QRingStravaBridge.apk
          ls -l /tmp/QRingStravaBridge.apk

      - uses: actions/upload-artifact@v4
        with:
          name: qring-apk
          path: /tmp/QRingStravaBridge.apk
          if-no-files-found: error

  release:
    name: Publier la Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qring-apk
          path: dist

      - name: Publier (tag fixe bridge-latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          CODE: ${{ needs.build.outputs.code }}
        run: |
          set -euo pipefail
          ls -l dist
          SHA=$(sha256sum dist/QRingStravaBridge.apk | cut -d' ' -f1)
          echo "SHA-256 : $SHA"

          if gh release view bridge-latest >/dev/null 2>&1; then
            gh release delete bridge-latest --yes --cleanup-tag
          fi

          {
            echo "**Pont QRing → Strava v${VERSION}** (versionCode ${CODE})"
            echo
            echo "APK signée avec la keystore versionnée : elle s'installe par-dessus"
            echo "les versions précédentes."
            echo
            echo '```'
            echo "SHA-256 : ${SHA}"
            echo '```'
            echo
            echo '```bash'
            echo "adb install -r QRingStravaBridge.apk"
            echo '```'
            echo
            echo "Ou ouvrir le fichier depuis le téléphone (autoriser l'installation"
            echo "depuis cette source)."
          } > notes.md

          gh release create bridge-latest \
            --title "Pont QRing → Strava — dernière version" \
            --notes-file notes.md \
            dist/QRingStravaBridge.apk

          curl -sIL -o /dev/null -w "lien public : %{http_code}\n" \
            "https://github.com/${GH_REPO}/releases/download/bridge-latest/QRingStravaBridge.apk"
