apply plugin: 'com.android.application'

android {
    namespace 'com.qring.strava.bridge'
    compileSdk 34

    defaultConfig {
        applicationId "com.qring.strava.bridge"
        minSdk 23
        targetSdk 34
        versionCode 9
        versionName "3.6"
    }

    buildTypes {
        release {
            minifyEnabled false
            // APK de production : signée avec la keystore de release si fournie,
            // sinon debug (voir README).
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // Aucune dépendance externe : 100 % framework Android.
}
